<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopper Intent Predictor</title>

  <style>
    body {
      font-family: Arial;
      background: #f5e6d3;
      text-align: center;
      padding: 30px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 400px;
      margin: auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    input, select {
      width: 90%;
      padding: 8px;
      margin: 8px;
    }

    button {
      padding: 10px 20px;
      background: brown;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>🛒 Shopper Predictor</h2>

  <form method="post">

    <input type="number" name="Administrative" placeholder="Administrative" required>

    <input type="number" step="any" name="Administrative_Duration" placeholder="Administrative Duration" required>

    <select name="Month">
      <option>Feb</option><option>Mar</option><option>Apr</option>
      <option>May</option><option>June</option><option>Jul</option>
      <option>Aug</option><option>Sep</option><option>Oct</option>
      <option>Nov</option><option>Dec</option><option>Jan</option>
    </select>

    <select name="VisitorType">
      <option>Returning_Visitor</option>
      <option>New_Visitor</option>
      <option>Other</option>
    </select>

    <select name="Weekend">
      <option value="True">Weekend (True)</option>
      <option value="False">Weekday (False)</option>
    </select>

    <br>
    <button type="submit">Predict</button>
  </form>

  {% if prediction is not none %}
    <div class="result">
      {% if prediction == True %}
        ✅ Customer WILL Purchase
      {% else %}
        ❌ Customer will NOT Purchase
      {% endif %}
    </div>
  {% endif %}

</div>

</body>
</html>
