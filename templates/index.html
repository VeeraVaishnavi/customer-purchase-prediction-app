<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopper Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="glow-card">
        
        <!-- Badge -->
        <div class="badge anim-1">
            $ E-Commerce Intelligence
        </div>

        <!-- Title -->
        <h1 class="title anim-2">
            Shopper <span>Predictor</span>
        </h1>

        <!-- Description -->
        <p class="description anim-3">
            Predict whether an online shopper is likely to make a purchase based on their browsing behavior and visit information.
        </p>

        <!-- YOUR CUSTOM FLOW BUTTON -->
        <div style="padding-top: 20px; display: flex; justify-content: center;" class="anim-4">
            <a href="/predict" class="flow-btn">
                
                <!-- Left Arrow -->
                <svg class="arr-left" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
                </svg>
                
                <!-- Text -->
                <span class="btn-text">Get Started</span>
                
                <!-- Right Arrow -->
                <svg class="arr-right" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
                </svg>
                
                <!-- Expanding Background Circle -->
                <span class="circle-bg"></span>

            </a>
        </div>

        <!-- The background Glow -->
        <div class="glow-effect anim-glow"></div>
        
    </div>

</body>
</html>
